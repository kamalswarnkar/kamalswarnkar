<svg xmlns="http://www.w3.org/2000/svg" width="320" height="44" viewBox="0 0 320 44" role="img" aria-label="Open to ML and AI internships">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#0F2A22"/></linearGradient>
  </defs>
  <style>
    .ring { transform-origin: 26px 22px; animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="319" height="43" rx="21.5" fill="url(#bg)" stroke="#1F6B4F"/>
  <circle class="ring" cx="26" cy="22" r="5" fill="#22C55E"/>
  <circle cx="26" cy="22" r="5" fill="#22C55E"/>
  <text x="46" y="27.5" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#DCFCE7">Open to ML / AI internships</text>
</svg>
