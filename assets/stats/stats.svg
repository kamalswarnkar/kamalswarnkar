<svg xmlns="http://www.w3.org/2000/svg" width="495" height="205" viewBox="0 0 495 205" role="img" aria-labelledby="t d">
  <title id="t">GitHub overview</title>
  <desc id="d">Repositories, commits, languages and a consistency grade based on the last 90 days</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/><stop offset="0.6" stop-color="#111936"/><stop offset="1" stop-color="#1B1F4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.38"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.12"/></pattern>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="204" rx="16" fill="url(#bg)" stroke="#26314D"/>
  <rect x="0.5" y="0.5" width="494" height="204" rx="16" fill="url(#dots)"/>
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="30" y="42" font-size="18" font-weight="700" fill="#F8FAFC">Kamal's GitHub Stats</text>
    <rect x="30" y="52" width="44" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="30" y="90" font-size="14" fill="#94A3B8">Public Repositories</text>
    <text x="285" y="90" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">23</text>
    <text x="30" y="115" font-size="14" fill="#94A3B8">Total Commits</text>
    <text x="285" y="115" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">694</text>
    <text x="30" y="140" font-size="14" fill="#94A3B8">Pull Requests</text>
    <text x="285" y="140" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">2</text>
    <text x="30" y="165" font-size="14" fill="#94A3B8">Languages Used</text>
    <text x="285" y="165" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">16</text>
    <text x="30" y="190" font-size="14" fill="#94A3B8">Contributed To</text>
    <text x="285" y="190" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">3</text>
    <style>@keyframes sweep395 { from { stroke-dasharray: 0 276.5; } } .sweep395 { animation: sweep395 1.6s cubic-bezier(.2,.7,.2,1) both; } @media (prefers-reduced-motion: reduce) { .sweep395 { animation: none; } }</style>
    <circle cx="395" cy="108" r="44" fill="none" stroke="#1E2A47" stroke-width="8"/>
    <circle class="sweep395" cx="395" cy="108" r="44" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="190.5 276.5" transform="rotate(-90 395 108)"/>
    <text x="395" y="120" font-size="34" font-weight="800" fill="#F8FAFC" text-anchor="middle">B+</text>
    <text x="395" y="172" font-size="11" letter-spacing="1.5" fill="#64748B" text-anchor="middle">CONSISTENCY</text>
    <text x="395" y="188" font-size="11" fill="#94A3B8" text-anchor="middle">62 of 90 days active</text>
  </g>
</svg>
