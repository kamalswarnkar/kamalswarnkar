<svg xmlns="http://www.w3.org/2000/svg" width="495" height="205" viewBox="0 0 495 205" role="img" aria-labelledby="t d">
  <title id="t">GitHub stats</title>
  <desc id="d">Stars, commits, pull requests, issues and overall grade</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/><stop offset="0.6" stop-color="#111936"/><stop offset="1" stop-color="#1B1F4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.38"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.12"/></pattern>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="204" rx="16" fill="url(#bg)" stroke="#26314D"/>
  <rect x="0.5" y="0.5" width="494" height="204" rx="16" fill="url(#dots)"/>
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="30" y="42" font-size="18" font-weight="700" fill="#F8FAFC">Kamal's GitHub Stats</text>
    <rect x="30" y="52" width="44" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="30" y="90" font-size="14" fill="#94A3B8">Total Stars Earned</text>
    <text x="285" y="90" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">1</text>
    <text x="30" y="115" font-size="14" fill="#94A3B8">Total Commits</text>
    <text x="285" y="115" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">564</text>
    <text x="30" y="140" font-size="14" fill="#94A3B8">Total Pull Requests</text>
    <text x="285" y="140" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">0</text>
    <text x="30" y="165" font-size="14" fill="#94A3B8">Total Issues</text>
    <text x="285" y="165" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">0</text>
    <text x="30" y="190" font-size="14" fill="#94A3B8">Contributed To</text>
    <text x="285" y="190" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">3</text>
    <circle cx="395" cy="112" r="44" fill="none" stroke="#1E2A47" stroke-width="8"/>
    <circle cx="395" cy="112" r="44" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="27.6 276.5" transform="rotate(-90 395 112)"/>
    <text x="395" y="124" font-size="34" font-weight="800" fill="#F8FAFC" text-anchor="middle">C</text>
    <text x="395" y="180" font-size="11" letter-spacing="1.5" fill="#64748B" text-anchor="middle">OVERALL GRADE</text>
  </g>
</svg>
