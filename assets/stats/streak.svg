<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="t d">
  <title id="t">Contribution streak</title>
  <desc id="d">Total contributions, current streak and longest streak</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/><stop offset="0.6" stop-color="#111936"/><stop offset="1" stop-color="#1B1F4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.38"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.12"/></pattern>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="194" rx="16" fill="url(#bg)" stroke="#26314D"/>
  <rect x="0.5" y="0.5" width="494" height="194" rx="16" fill="url(#dots)"/>
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <line x1="165" y1="34" x2="165" y2="162" stroke="#26314D"/>
    <line x1="330" y1="34" x2="330" y2="162" stroke="#26314D"/>
    <text x="82" y="96" font-size="34" font-weight="800" fill="#F8FAFC" text-anchor="middle">698</text>
    <text x="82" y="130" font-size="14" font-weight="600" fill="#A5B4FC" text-anchor="middle">Total Contributions</text>
    <text x="82" y="152" font-size="12" fill="#94A3B8" text-anchor="middle">Oct 26, 2023 – Present</text>
    <circle cx="247" cy="82" r="36" fill="none" stroke="#1E2A47" stroke-width="8"/>
    <circle cx="247" cy="82" r="36" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="12.6 226.2" transform="rotate(-90 247 82)"/>
    <text x="247" y="93" font-size="30" font-weight="800" fill="#F8FAFC" text-anchor="middle">1</text>
    <text x="247" y="144" font-size="14" font-weight="600" fill="#22D3EE" text-anchor="middle">Current Streak</text>
    <text x="247" y="164" font-size="12" fill="#94A3B8" text-anchor="middle">Sep 20</text>
    <text x="412" y="96" font-size="34" font-weight="800" fill="#F8FAFC" text-anchor="middle">18</text>
    <text x="412" y="130" font-size="14" font-weight="600" fill="#A5B4FC" text-anchor="middle">Longest Streak</text>
    <text x="412" y="152" font-size="12" fill="#94A3B8" text-anchor="middle">Aug 31 – Sep 17</text>
  </g>
</svg>
